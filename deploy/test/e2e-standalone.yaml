# Laid over compose.yaml by the end-to-end test (scripts/docker-e2e.ts): the
# standalone variant, where bumail binds port 80 itself, on the test network
# (at a fixed address the test's DNS answers with) and trusting the test CA.
name: bumail-e2e-docker-standalone

services:
  bumail:
    dns: [172.29.77.250]
    environment:
      NODE_EXTRA_CA_CERTS: /pebble/minica.pem
    volumes:
      - ${E2E_DIR}/minica.pem:/pebble/minica.pem:ro
    networks:
      default: {}
      proxy:
        ipv4_address: 172.29.77.150

networks:
  proxy:
    name: bumail-e2e-proxy
    external: true
