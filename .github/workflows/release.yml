name: Release

# Every consumer of these packages installs a published version, so a merge to
# develop that changes a package is only half a change until it is on the
# registry. This workflow is the other half: it turns the changesets sitting in
# .changeset/ into version bumps, then publishes.
#
# It opens a "Version Packages" pull request rather than publishing straight
# from develop; merging that PR is what releases. That keeps the version bump
# and the changelog reviewable, and keeps an accidental merge from publishing.

on:
  push:
    branches: [develop]
  # Pushes the image of a version already on npm, by hand: when the push after
  # a release failed, or to add a tag. Run it from Actions, naming the version.
  workflow_dispatch:
    inputs:
      version:
        description: 'The @bumail/server version whose image to push, for example 0.1.0'
        required: true
        type: string
      minor:
        description: 'Also move its <major>.<minor> tag (only for the newest patch of that minor; a release does so on its own)'
        required: false
        type: boolean
        default: false
      latest:
        description: 'Also tag it latest (a release does so on its own)'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Each job asks for what it needs, and no more.
permissions: {}

jobs:
  release:
    name: Release
    # A manual run only pushes an image: the "image" job below.
    if: github.event_name == 'push'
    # As alxia's: no switch and no environment, and NPM_TOKEN is the softistx
    # organisation's secret. With no changeset pending, a push publishes any
    # version npm lacks; normally only merging the "Version packages" PR
    # produces one, and only the owner merges that PR — an agent never does.
    # GitHub-hosted, as ci.yml.
    runs-on: ubuntu-latest
    # alxia's, on the same skeleton, takes under a minute and a half.
    # Generous on purpose: a publish killed half-way is worse than one waited
    # on, and the concurrency group above never cancels one under way — this
    # only stops a run that has hung.
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      # The version of @bumail/server this run published, or empty.
      server-version: ${{ steps.server.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup
        uses: ./.github/actions/setup
      - name: Build packages
        run: bun run build
      # No npmrc step: `bunfig.toml` reads $NPM_TOKEN from the environment.
      # v2 of the action no longer writes one from NPM_TOKEN either.
      - name: Version or publish
        id: changesets
        uses: changesets/action@v2
        with:
          version-script: bun run changeset:version
          publish-script: bun run changeset:publish
          pr-title: 'chore: Version packages'
          commit-message: 'chore: Version packages'
          # v2 ignores GITHUB_TOKEN in env for its own GitHub API calls.
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          # changelog-github still reads GITHUB_TOKEN while versioning.
          # NPM_TOKEN publishes, read through bunfig.toml.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      # The tag the action pushes is pushed with GITHUB_TOKEN, which triggers no
      # workflow, so the image cannot hang off a tag push: the "image" job below
      # reads this output instead. `published-packages` (v2 names its outputs in
      # kebab-case) is a JSON array of { name, version }, and `published` is
      # 'true' only when a package went out.
      - name: Was @bumail/server published?
        id: server
        env:
          PUBLISHED: ${{ steps.changesets.outputs.published }}
          PACKAGES: ${{ steps.changesets.outputs.published-packages }}
        run: |
          version=""
          if [ "$PUBLISHED" = "true" ]; then
            version=$(jq -r '[.[] | select(.name == "@bumail/server")][0].version // empty' <<< "$PACKAGES")
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "@bumail/server published by this run: ${version:-no}"

  image:
    name: Image
    needs: release
    # After a release that published @bumail/server, or when run by hand. Not
    # `always()`: a release that failed pushes no image. A skipped `release`
    # (the manual run) lets this job run, so its condition is explicit.
    if: >-
      !cancelled() && (
        (github.event_name == 'push' && needs.release.result == 'success' && needs.release.outputs.server-version != '') ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    # The Dockerfile cross-compiles each architecture's binary on the runner
    # (bun build --target) and runs nothing of the image's platform, so there
    # is no QEMU step and the build takes about as long as a single-arch one.
    timeout-minutes: 30
    # Reads the sources and pushes the image; BuildKit's provenance and SBOM
    # are attestations pushed with it, and need no other permission.
    permissions:
      contents: read
      packages: write
    env:
      # Never taken from the event inside a script: through the environment.
      VERSION: ${{ needs.release.outputs.server-version || inputs.version }}
      LATEST: ${{ github.event_name == 'push' || inputs.latest }}
      # A manual run for an older patch must not move 0.1 back to it.
      MINOR: ${{ github.event_name == 'push' || inputs.minor }}
    steps:
      - name: The version is one npm has
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "not a version: '$VERSION'" >&2
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            curl --silent --fail "https://registry.npmjs.org/@bumail%2Fserver/$VERSION" > /dev/null \
              || { echo "@bumail/server@$VERSION is not on npm" >&2; exit 1; }
          fi
      # The tag the release pushed (or an earlier one, by hand), so the image is
      # built from the sources of the version it carries and no other.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: refs/tags/@bumail/server@${{ needs.release.outputs.server-version || inputs.version }}
      - name: Tags
        id: tags
        run: |
          image=ghcr.io/softistx/bumail
          tags="$image:$VERSION"
          # A prerelease gets its own tag only: never 0.2, never latest.
          if ! [[ "$VERSION" == *-* ]]; then
            if [ "$MINOR" = true ]; then tags="$tags,$image:${VERSION%.*}"; fi
            if [ "$LATEST" = true ]; then tags="$tags,$image:latest"; fi
          fi
          {
            echo "tags=$tags"
            echo "revision=$(git rev-parse HEAD)"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # The source label is what links the package to this repository on
          # GitHub, and lets it inherit the repository's access.
          labels: |
            org.opencontainers.image.source=https://github.com/softistx/bumail
            org.opencontainers.image.url=https://github.com/softistx/bumail
            org.opencontainers.image.documentation=https://github.com/softistx/bumail/blob/develop/packages/server/docs/deploy.md
            org.opencontainers.image.title=bumail
            org.opencontainers.image.description=The bumail mail server: SMTP, IMAP and JMAP in one binary
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ steps.tags.outputs.revision }}
            org.opencontainers.image.created=${{ steps.tags.outputs.created }}
            org.opencontainers.image.licenses=MIT
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
